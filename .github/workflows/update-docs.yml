name: Update Kurigram Docs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      docs_url:
        description: 'URL to docs.zip file (leave empty to use default)'
        required: false
        type: string

permissions:
  contents: write

env:
  DOCS_URL: ${{ inputs.docs_url || 'https://docs.kurigram.icu/docs.zip' }}

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.46.1
          npx playwright install --with-deps chromium

      - name: Download docs archive via real browser
        env:
          DOCS_URL: ${{ env.DOCS_URL }}
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const url = process.env.DOCS_URL || 'https://docs.kurigram.icu/docs.zip';

            console.log('Trying browser download from:', url);

            const browser = await chromium.launch({
              headless: true,
              args: [
                '--disable-dev-shm-usage',
                '--disable-gpu',
                '--no-sandbox',
                '--disable-setuid-sandbox',
              ]
            });

            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
              viewport: { width: 1440, height: 1400 },
              locale: 'en-US',
              timezoneId: 'Europe/Berlin',
              acceptDownloads: true,
              extraHTTPHeaders: {
                'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8',
                'Accept-Language': 'en-US,en;q=0.9',
                'Upgrade-Insecure-Requests': '1',
                'Cache-Control': 'no-cache',
                'Pragma': 'no-cache',
              }
            });

            const page = await context.newPage();

            try {
              const response = await page.goto(url, {
                waitUntil: 'domcontentloaded',
                timeout: 120000,
              });

              const status = response ? response.status() : 0;
              const finalUrl = page.url();
              console.log('HTTP status:', status);
              console.log('Final URL:', finalUrl);

              const headers = response ? response.headers() : {};
              console.log('Content-Type:', headers['content-type']);
              console.log('Server:', headers.server || 'n/a');

              let bodyText = '';
              try {
                bodyText = await page.textContent('body');
              } catch (e) {
                bodyText = '';
              }

              if (bodyText) {
                const snippet = bodyText.replace(/\s+/g, ' ').slice(0, 2000);
                console.log('Body snippet:', snippet);
              }

              if (status >= 400) {
                throw new Error(`Browser download failed with HTTP ${status}. Likely Cloudflare challenge or server-side block.`);
              }

              const lower = (bodyText || '').toLowerCase();
              if (
                lower.includes('just a moment') ||
                lower.includes('checking your browser') ||
                lower.includes('cf-challenge') ||
                lower.includes('cloudflare')
              ) {
                throw new Error('Cloudflare challenge page detected instead of the ZIP file.');
              }

              if (!response) {
                throw new Error('No HTTP response received from browser');
              }

              const buffer = await response.body();
              if (!buffer || buffer.length === 0) {
                throw new Error('Empty response body received from browser');
              }

              fs.writeFileSync('docs.zip', buffer);
              console.log('Downloaded ZIP bytes:', buffer.length);
              console.log('Browser download succeeded.');

            } finally {
              await browser.close();
            }
          })().catch((err) => {
            console.error('FATAL:', err.message || err);
            process.exit(1);
          });
          NODE

      - name: Verify archive integrity
        run: |
          echo "Checking zip integrity..."
          unzip -t docs.zip > /dev/null
          echo "Archive integrity verified"

      - name: Extract to temp directory
        run: |
          set -e
          echo "Extracting archive..."
          rm -rf .tmp-docs
          mkdir -p .tmp-docs
          unzip -oq docs.zip -d .tmp-docs
          rm -f docs.zip

          if [ ! -d '.tmp-docs' ] || [ -z "$(ls -A .tmp-docs)" ]; then
            echo "Archive extraction resulted in empty directory"
            exit 1
          fi

          echo "Archive extracted successfully"
          find .tmp-docs -maxdepth 2 -type f | head

      - name: Update kurigram-docs folder
        run: |
          set -e
          echo "Replacing kurigram-docs content..."
          mkdir -p kurigram-docs
          find kurigram-docs -mindepth 1 -delete
          rsync -a --delete .tmp-docs/ kurigram-docs/
          rm -rf .tmp-docs
          echo "kurigram-docs folder updated"

      - name: Normalize line endings
        run: |
          echo "Normalizing line endings in kurigram-docs..."
          find kurigram-docs -type f \
            \( -iname '*.html' -o -iname '*.css' -o -iname '*.js' -o -iname '*.json' -o -iname '*.md' \) \
            -exec perl -0pi -e 's/\r\n/\n/g' {} +
          echo "Line endings normalized"

      - name: Detect meaningful changes
        id: changes
        run: |
          set -e
          echo "Checking for meaningful differences in kurigram-docs..."
          git add kurigram-docs

          if git diff --cached --quiet --ignore-all-space --ignore-blank-lines -- kurigram-docs/; then
            echo "No meaningful changes detected"
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo "Meaningful changes detected"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "Preparing commit..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "update(kurigram-docs): dump from $(date -u +'%Y-%m-%d %H:%M UTC')"
          echo "Commit created. Pushing to current branch..."
          git push
          echo "Push complete"

      - name: Nothing to commit
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "Skipping commit because kurigram-docs content is identical"

      - name: Final status notice
        run: |
          if [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "::notice title=Kurigram docs updated::Content in kurigram-docs changed and was committed to the current branch."
          else
            echo "::notice title=Kurigram docs unchanged::No meaningful diff was detected in kurigram-docs; nothing was committed."
          fi

          echo "## ✅ Kurigram Docs Update Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.changes.outputs.changed == 'true' && '✅ Changes committed' || '⏭️ No changes (content identical)' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Source URL:** ${{ env.DOCS_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**Updated folder:** kurigram-docs/" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY