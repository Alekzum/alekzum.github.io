name: Update Kurigram Docs

on:
  workflow_dispatch:
    inputs:
      docs_url:
        description: 'URL to docs.zip file'
        required: true
        type: string
        default: 'https://docs.kurigram.icu/docs.zip'

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download docs archive
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install cloudscraper
          python - <<'PY'
          import sys
          import time
          import cloudscraper

          url = '${{ inputs.docs_url }}'
          scraper = cloudscraper.create_scraper(browser={'browser': 'chrome', 'platform': 'windows', 'desktop': True})

          for attempt in range(1, 4):
              try:
                  print(f"Download attempt {attempt}/3...")
                  response = scraper.get(url, timeout=60)
                  response.raise_for_status()
                  with open('docs.zip', 'wb') as f:
                      f.write(response.content)
                  print('Download successful')
                  sys.exit(0)
              except Exception as e:
                  print(f'Download failed: {e}')
                  if attempt < 3:
                      print('Retrying in 5s...')
                      time.sleep(5)

          print('Failed to download docs.zip after 3 attempts')
          sys.exit(1)
          PY

      - name: Verify archive integrity
        run: |
          unzip -t docs.zip > /dev/null
          echo 'Archive integrity verified'

      - name: Extract to temp directory
        run: |
          set -e
          rm -rf .tmp-docs
          mkdir -p .tmp-docs
          unzip -oq docs.zip -d .tmp-docs
          rm -f docs.zip

          if [ ! -d '.tmp-docs' ] || [ -z "$(ls -A .tmp-docs)" ]; then
            echo 'Archive extraction resulted in empty directory'
            exit 1
          fi

      - name: Update kurigram-docs folder
        run: |
          set -e
          mkdir -p kurigram-docs
          find kurigram-docs -mindepth 1 -delete
          rsync -a --delete .tmp-docs/ kurigram-docs/
          rm -rf .tmp-docs

      - name: Normalize line endings
        run: |
          find kurigram-docs -type f \
            \( -iname '*.html' -o -iname '*.css' -o -iname '*.js' -o -iname '*.json' -o -iname '*.md' \) \
            -exec perl -0pi -e 's/\r\n/\n/g' {} +

      - name: Detect meaningful changes
        id: changes
        run: |
          set -e
          git add kurigram-docs

          if git diff --cached --quiet --ignore-all-space --ignore-blank-lines -- kurigram-docs/; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "update(kurigram-docs): dump from $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
